services:
  api:
    build:
        context: .
        dockerfile: Dockerfile
    container_name: fitness-tracker-api
    ports:
      - "7245:8080"  
    environment:
        ASPNETCORE_ENVIRONMENT: Development
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT}
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        JWT_KEY: ${JWT_KEY}
        IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
     image: postgres:17
     container_name: fitness-tracker-postgres
     environment:
        POSTGRES_DB: ${DB_NAME}
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
     ports:     
        - "${DB_PORT}:5432"
     volumes:
        - postgres-data:/var/lib/postgresql/data
     healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 15s
        
volumes:
    postgres-data:


